<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kleiderspenden Registrierung</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

<header>
    <h1>Kleiderspenden Portal</h1>
</header>

<main>
    <h2>Spende registrieren</h2>

    <p>Bitte wählen Sie eine Übergabeart:</p>

    <label>
        <input type="radio" name="art" value="abgabe"> Übergabe an der Geschäftsstelle
    </label><br>

    <label>
        <input type="radio" name="art" value="abholung"> Abholung durch Fahrzeug
    </label>

    <h3>Art der Kleidung</h3>
    <select>
        <option>Jacken</option>
        <option>Hosen</option>
        <option>Schuhe</option>
        <option>T-Shirts</option>
    </select>

    <h3>Krisengebiet</h3>
    <select>
        <option>Ukraine</option>
        <option>Syrien</option>
        <option>Türkei</option>
        <option>Afghanistan</option>
    </select>

    <br><br>
    <button>Registrieren</button>
</main>

<footer>
    <p>IU Fallstudie – Webanwendungsoberflächen</p>
</footer>
<script src="script/js"></script>

</body>

</html>
