<!DOCTYPE html>
<html lang="de">
<head >
    <meta charset="UTF-8">
    <title>Kleiderspenden Registrierung</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt–5">

<header>
    <h1>Kleiderspenden Portal</h1>
</header>
    <div class="mb-3">
  <label>Art der Übergabe</label>
  <select id="type" class="form-control">
    <option value="geschaeft">Geschäftsstelle</option>
    <option value="abholung">Abholung</option>
  </select>
</div>

<div class="mb-3">
  <label>Adresse</label>
  <input type="text" id="address" class="form-control">
</div>

<div class="mb-3">
  <label>PLZ</label>
  <input type="text" id="plz" class="form-control">
</div>

<div class="mb-3">
  <label>Kleidung</label>
  <input type="text" id="cloth" class="form-control">
</div>

<div class="mb-3">
  <label>Krisengebiet</label>
  <select id="region" class="form-control">
    <option>Ukraine</option>
    <option>Syrien</option>
  </select>
</div>

<button onclick="submitForm()" class="btn btn-primary">Absenden</button>

<main>
    <h2>Spende registrieren</h2>

    <p>Bitte wählen Sie eine Übergabeart:</p>

    <label>
        <input type="radio" name="art" value="abgabe"> Übergabe an der Geschäftsstelle
    </label><br>

    <label>
        <input type="radio" name="art" value="abholung"> Abholung durch Fahrzeug
    </label>

    <h3>Art der Kleidung</h3>
    <select>
        <option>Jacken</option>
        <option>Hosen</option>
        <option>Schuhe</option>
        <option>T-Shirts</option>
    </select>

    <h3>Krisengebiet</h3>
    <select>
        <option>Ukraine</option>
        <option>Syrien</option>
        <option>Türkei</option>
        <option>Afghanistan</option>
    </select>

    <br><br>
    <button>Registrieren</button>
</main>

<footer>
    <p>IU Fallstudie – Webanwendungsoberflächen</p>
</footer>
<script src="script/script.js"></script>

</body>

</html>
