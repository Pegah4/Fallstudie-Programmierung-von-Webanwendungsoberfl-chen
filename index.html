<!DOCTYPE html>
<html lang="de">
<head >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Kleiderspenden Registrierung</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt–5">

<header>
    <h1>Kleiderspenden Portal</h1>
</header>
    <form>
    <div class="mb-3">
  <label>Art der Übergabe</label>
  <select id="type" class="form-control">
    <option value="geschaeft">Geschäftsstelle</option>
    <option value="abholung">Abholung</option>
  </select>
</div>

<div class="mb-3" id="addressBox">
  <label>Adresse</label>
  <input type="text" id="address" class="form-control">
</div>

<div class="mb-3" id="plzBox">
  <label>PLZ</label>
  <input type="text" id="plz" class="form-control">
</div>

<div class="mb-3">
  <label>Kleidung</label>
  <input type="text" id="cloth" class="form-control">
</div>

<div class="mb-3">
  <label>Krisengebiet</label>
  <select id="region" class="form-control">
    <option>Ukraine</option>
    <option>Syrien</option>
  </select>
</div>

<button type="button" onclick="submitForm()" class="btn btn-primary">Absenden</button>
<button type="reset" class="btn btn-secondary">Zurücksetzen</button>
</form>
<footer>
    <p>IU Fallstudie – Webanwendungsoberflächen</p>
</footer>
<script src="script/script.js"></script>
</body>
</html>
